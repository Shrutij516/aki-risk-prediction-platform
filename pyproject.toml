[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aki-reconstruction"
version = "0.1.0"
description = "Reconstruction of the AKI dialysis-risk pipeline: PostgreSQL, PyTorch models, FastAPI + React dashboard (see PROVENANCE.md)"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyarrow>=15", "psycopg[binary]>=3.2", "pandas>=2", "numpy>=1.26",
                "scikit-learn>=1.5", "torch>=2.4", "mlflow>=3.0", "fastapi>=0.110", "uvicorn[standard]>=0.29",
                "pgserver>=0.1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["aki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
